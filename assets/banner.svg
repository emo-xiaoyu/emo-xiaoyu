<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" role="img" aria-label="xiaoyu terminal banner">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58e6d9"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect width="940" height="340" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="937" height="337" rx="12.5" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="24" y="24" width="5" height="292" rx="2.5" fill="url(#accent)"/>

  <!-- title bar -->
  <circle cx="56" cy="50" r="7.5" fill="#ff5f57"/>
  <circle cx="82" cy="50" r="7.5" fill="#febc2e"/>
  <circle cx="108" cy="50" r="7.5" fill="#28c840"/>
  <text x="470" y="57" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8b949e" text-anchor="middle">xiaoyu@git — one window · seventeen agents</text>
  <line x1="24" y1="76" x2="916" y2="76" stroke="#30363d" stroke-width="1.5"/>

  <!-- body -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="21">
    <text x="52" y="122" fill="#e6edf3">$ whoami</text>
    <text x="76" y="156" fill="#3fb950">给 AI 当 HR 的人 · 每天调度 17 个 Agent 干活</text>

    <text x="52" y="200" fill="#e6edf3">$ ./harness-mix --agents 17 --window 1</text>
    <text x="76" y="234" fill="#3fb950">✔ 17 个 Agent 已上线，正在有序内卷</text>

    <text x="52" y="278" fill="#e6edf3">$ git commit -m "YOLO"</text>
    <text x="76" y="312" fill="#a371f7">[main 0x1D3A] ★200+ · 已合并（没人 review，也没出事）</text>
  </g>

  <!-- blinking cursor -->
  <rect x="52" y="322" width="12" height="6" fill="#58e6d9">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
